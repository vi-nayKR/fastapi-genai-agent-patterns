services:
  api:
    build: .
    environment:
      AGENT_PATTERNS_ENVIRONMENT: local
      AGENT_PATTERNS_REDIS_URL: redis://redis:6379/0
      AGENT_PATTERNS_CACHE_REQUIRED: "true"
      AGENT_PATTERNS_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"

volumes:
  redis-data:
